name: UnoDraw supplemental depth-prepass diagnostic

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: unodraw-depth-prepass-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_HARNESS_SHA: '22d33286feccb2d53484744d9ecf7f9f6d17e72d'
  PACKAGE_SOURCE_SHA: '22d33286feccb2d53484744d9ecf7f9f6d17e72d'
  PACKAGE_RUN_ID: '43316652725'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  contracts:
    name: Verify supplemental depth-probe contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify only the new probe, observer and workflow contracts
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s tests/UnoDraw.BrowserDepthPrepass -p 'test_*.py'
          node --test tests/UnoDraw.BrowserDepthPrepass/test_depth_observer.mjs

  compare:
    name: Single-canvas selection with and without depth attachments
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract the immutable primary harness before imports
        run: |
          test "$(git rev-parse "${PRIMARY_HARNESS_SHA}^{commit}")" = "$PRIMARY_HARNESS_SHA"
          mkdir -p artifacts/pinned-acquisition-harness
          git archive --format=tar "$PRIMARY_HARNESS_SHA" tests/UnoDraw.BrowserPerformance tests/UnoDraw.BrowserSmoke > artifacts/primary-harness.tar
          tar -xf artifacts/primary-harness.tar -C artifacts/pinned-acquisition-harness
      - name: Acquire only the original candidate AOT archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python artifacts/pinned-acquisition-harness/tests/UnoDraw.BrowserPerformance/candidate_package.py
          --run-id "$PACKAGE_RUN_ID" --output artifacts/package
          --receipt artifacts/package-artifact.json
      - name: Install the original pinned browser dependencies
        run: |
          python -m pip install -r artifacts/pinned-acquisition-harness/tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compare the two explicit depth configurations
        run: >-
          python tests/UnoDraw.BrowserDepthPrepass/depth_probe.py
          --harness . --harness-sha "$PRIMARY_HARNESS_SHA"
          --package artifacts/package --receipt artifacts/package-artifact.json
          --expected-source "$PACKAGE_SOURCE_SHA" --bridge single-canvas
          --output artifacts/depth-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-depth-prepass-single-canvas-selection
          path: |
            artifacts/depth-probe
            artifacts/package-artifact.json
            artifacts/primary-harness.tar
          if-no-files-found: warn
          retention-days: 14
