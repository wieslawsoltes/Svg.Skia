name: UnoDraw performance

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Current regression baseline
        default: 96e5fa9d84b694e34a626b8867f2466fc231b6a7
      candidate_ref:
        description: Candidate ref (empty uses this workflow's commit)
        default: ''
      reference_ref:
        description: Pre-Uno-7 reference (empty skips the historical build)
        default: dbe9dd165f7eb63c1c6c9e6dac11091728062824
      repeats:
        description: Independent trials per workload and renderer
        default: '3'
  pull_request:
    paths:
      - '.github/workflows/unodraw-performance.yml'
      - 'global.json'
      - 'Directory.*.props'
      - 'samples/UnoDraw/**'
      - 'src/Svg.Editor.Core/**'
      - 'src/Svg.Editor.Skia/**'
      - 'src/Svg.Editor.Skia.Uno/**'
      - 'src/Svg.Editor.Svg/**'
      - 'src/Svg.Skia/**'
      - 'tests/UnoDraw.BrowserPerformance/**'
      - 'tests/UnoDraw.BrowserSmoke/**'

permissions:
  contents: read

# A newer candidate must not discard an expensive baseline already in flight.
concurrency:
  group: unodraw-performance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      repeats: ${{ steps.plan.outputs.repeats }}
      candidate_ref: ${{ steps.plan.outputs.candidate_ref }}
      baseline_ref: ${{ steps.plan.outputs.baseline_ref }}
    steps:
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REFERENCE_REF: ${{ inputs.reference_ref }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          python - <<'PY'
          import json
          import os
          baseline = os.environ['BASELINE_REF'] or '96e5fa9d84b694e34a626b8867f2466fc231b6a7'
          candidate = os.environ['CANDIDATE_REF'] or os.environ['CURRENT_SHA']
          reference = (os.environ['REFERENCE_REF'] if os.environ['EVENT_NAME'] == 'workflow_dispatch'
                       else 'dbe9dd165f7eb63c1c6c9e6dac11091728062824')
          repeats = int(os.environ['REPEATS'] or '3')
          if not 2 <= repeats <= 20:
              raise ValueError('Use 2–20 independent trials')
          builds = [{'role': 'baseline', 'ref': baseline}, {'role': 'candidate', 'ref': candidate}]
          if reference:
              builds.append({'role': 'reference', 'ref': reference})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps({'include': builds}, separators=(',', ':')) + '\n')
              output.write(f'repeats={repeats}\n')
              output.write(f'candidate_ref={candidate}\n')
              output.write(f'baseline_ref={baseline}\n')
          PY

  publish:
    name: AOT package (${{ matrix.role }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      # Wait for an identical expensive package already being built, then reuse
      # its exact cache entry. Distinct candidate SHAs still build in parallel.
      group: unodraw-aot-${{ github.repository }}-${{ matrix.ref }}-sdk10.0.403-workload10.0.403-ubuntu24-release-copy-nothreads-v1
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          submodules: recursive
          path: source
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Pin SDK and workload selection without changing the source Uno.Sdk
        run: python harness/tests/UnoDraw.BrowserPerformance/toolchain.py --source source --pin
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json
      - name: Install the matching WebAssembly tools
        working-directory: source
        # sdk.workloadVersion pins the entire set; --skip-manifest-update alone
        # would retain whichever newer manifests happen to be on the runner.
        run: dotnet workload install wasm-tools
      - id: identity
        name: Resolve exact source and toolchain
        run: >-
          python harness/tests/UnoDraw.BrowserPerformance/toolchain.py
          --source source --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: published
        with:
          path: artifacts/package
          # Exact source, SDK, workload and build flags; never reuse an interpreter build.
          key: unodraw-aot-ubuntu24-${{ runner.arch }}-${{ steps.identity.outputs.sha }}-${{ steps.identity.outputs.sdk }}-${{ steps.identity.outputs.workload }}-release-copy-nothreads-v1
      - name: Publish unchanged Release InterpreterAndAOT settings
        if: steps.published.outputs.cache-hit != 'true'
        working-directory: source
        env:
          BINARYEN_CORES: '1'
        run: >-
          dotnet publish samples/UnoDraw/UnoDraw.csproj
          -f net10.0-browserwasm -p:UnoDrawTargetFrameworks=net10.0-browserwasm
          -c Release -p:WasmShellMonoRuntimeExecutionMode=InterpreterAndAOT
          -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          -o ../artifacts/package
      - name: Record source, fixture and packaged fonts
        run: >-
          python harness/tests/UnoDraw.BrowserPerformance/package_manifest.py
          --source source --package artifacts/package --role ${{ matrix.role }}
      - uses: actions/upload-artifact@v4
        with:
          name: unodraw-performance-package-${{ matrix.role }}
          path: artifacts/package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  bridge-quality-interpreter:
    name: Early WebGPU ${{ matrix.variant }} bridge quality (Interpreter)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bridge: persistent, variant: persistent }
          - { bridge: composite, variant: composite }
          - { bridge: legacy-composite, variant: legacy-composite }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
          submodules: recursive
          path: source
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Pin the same candidate SDK and workload set
        run: python harness/tests/UnoDraw.BrowserPerformance/toolchain.py --source source --pin
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json
      - name: Install the pinned WebAssembly tools
        working-directory: source
        run: dotnet workload install wasm-tools
      - name: Verify exact toolchain selection
        run: python harness/tests/UnoDraw.BrowserPerformance/toolchain.py --source source
      - name: Publish a separate interpreter package for early correctness only
        working-directory: source
        env:
          BINARYEN_CORES: '1'
        run: >-
          dotnet publish samples/UnoDraw/UnoDraw.csproj
          -f net10.0-browserwasm -p:UnoDrawTargetFrameworks=net10.0-browserwasm
          -c Release -p:WasmShellMonoRuntimeExecutionMode=Interpreter
          -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          -o ../artifacts/interpreter-package
      - name: Record the actual interpreter execution mode
        id: interpreter_manifest
        run: >-
          python harness/tests/UnoDraw.BrowserPerformance/package_manifest.py
          --source source --package artifacts/interpreter-package --role candidate
          --execution-mode Interpreter
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the same pinned correctness-test browser
        run: |
          python -m pip install -r harness/tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s harness/tests/UnoDraw.BrowserPerformance -p 'test_*.py'
      - name: Run unchanged native-pixel bridge checks without timing claims
        run: >-
          python harness/tests/UnoDraw.BrowserPerformance/bridge_quality.py
          --package artifacts/interpreter-package --output artifacts/unodraw-bridge-interpreter-quality
          --candidate-bridge ${{ matrix.bridge }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-${{ matrix.variant }}-bridge-interpreter-quality
          path: artifacts/unodraw-bridge-interpreter-quality
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: Compare ${{ matrix.backend }} ${{ matrix.workload }}
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    # Each revision and all three repeats of one comparison stay on one runner.
    # Splitting by workload/backend preserves every trial without timing out the
    # very slow software-GPU control or comparing revisions on different hosts.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, skia-preferred]
        workload: [idle, brush-hover, pan, zoom, selection, edit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: unodraw-performance-package-*
          path: artifacts/performance-packages
      - name: Install pinned correctness-test browser dependencies
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check observer and aggregation contracts
        run: |
          python -m unittest discover -s tests/UnoDraw.BrowserPerformance -p 'test_*.py'
          node --test tests/UnoDraw.BrowserPerformance/test_instrumentation.mjs
      - name: Benchmark unmodified artifacts with rotating trial order
        run: >-
          python tests/UnoDraw.BrowserPerformance/performance.py
          --packages artifacts/performance-packages
          --output artifacts/unodraw-performance
          --repeats ${{ needs.plan.outputs.repeats }} --steps 120 --graphics swiftshader --diagnostics
          --backend ${{ matrix.backend }} --workload ${{ matrix.workload }}
      - name: Publish measurement summary
        if: always()
        run: |
          if test -f artifacts/unodraw-performance/summary.md; then
            cat artifacts/unodraw-performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-performance-results-${{ matrix.backend }}-${{ matrix.workload }}
          path: artifacts/unodraw-performance
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Verify complete performance coverage
    needs: [plan, compare]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install report-validation dependencies
        run: python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: unodraw-performance-results-*
          path: artifacts/performance-shards
      - name: Verify and combine all twelve matched comparisons
        run: >-
          python tests/UnoDraw.BrowserPerformance/merge_shards.py
          --shards artifacts/performance-shards --output artifacts/unodraw-performance
          --repeats ${{ needs.plan.outputs.repeats }}
      - name: Publish the complete comparison summary
        if: always()
        run: |
          if test -f artifacts/unodraw-performance/summary.md; then
            cat artifacts/unodraw-performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-performance-results
          path: artifacts/unodraw-performance
          if-no-files-found: warn
          retention-days: 14

  bridge-quality:
    name: WebGPU ${{ matrix.variant }} bridge quality (DPR 1, 1.25, 2)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bridge: persistent, variant: persistent }
          - { bridge: composite, variant: composite }
          - { bridge: legacy-composite, variant: legacy-composite }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-candidate
          path: artifacts/candidate
      - name: Install the same pinned browser dependencies
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests/UnoDraw.BrowserPerformance -p 'test_*.py'
      - name: Compare the selected canvas path with legacy at native resolution
        run: >-
          python tests/UnoDraw.BrowserPerformance/bridge_quality.py
          --package artifacts/candidate --output artifacts/unodraw-bridge-quality
          --candidate-bridge ${{ matrix.bridge }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.bridge == 'persistent' && 'unodraw-bridge-quality' || format('unodraw-{0}-bridge-quality', matrix.variant) }}
          path: artifacts/unodraw-bridge-quality
          if-no-files-found: warn
          retention-days: 14

  svg-document-quality:
    name: Complete SVG document quality across all native device scales
    needs: publish
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/unodraw-svg-quality-shards.yml
    with:
      package_run_id: ${{ format('{0}', github.run_id) }}
      harness_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      candidate_bridge: legacy-composite

  document-raster-experiment:
    name: Same AOT ${{ matrix.variant }} canvas (${{ matrix.workload }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.bridge == 'legacy-composite' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workload: brush-hover, bridge: composite, variant: composite, artifact: unodraw-document-raster-experiment-brush-hover }
          - { workload: selection, bridge: composite, variant: composite, artifact: unodraw-document-raster-experiment-selection }
          - { workload: brush-hover, bridge: legacy-composite, variant: legacy-composite, artifact: unodraw-legacy-composite-document-raster-experiment-brush-hover }
          - { workload: selection, bridge: legacy-composite, variant: legacy-composite, artifact: unodraw-legacy-composite-document-raster-experiment-selection }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-candidate
          path: artifacts/candidate
      - name: Verify the exact application source
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/verify_source.py
          --package artifacts/candidate --output artifacts/document-raster-experiment
          --package-run-id "$GITHUB_RUN_ID"
      - name: Install the pinned browser and verify experiment contracts
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests/UnoDraw.BrowserPerformance -p 'test_*.py'
          node --test tests/UnoDraw.BrowserPerformance/test_instrumentation.mjs
      - name: Measure both declared bridge modes in this identical AOT package
        run: >-
          python tests/UnoDraw.BrowserPerformance/bridge_experiment.py
          --package artifacts/candidate --output artifacts/document-raster-experiment
          --workload ${{ matrix.workload }} --candidate-bridge ${{ matrix.bridge }} --repeats 3
          --harness-sha ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish the available matched comparison
        if: always()
        run: |
          if test -f artifacts/document-raster-experiment/summary.md; then
            cat artifacts/document-raster-experiment/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/document-raster-experiment
          if-no-files-found: warn
          retention-days: 14

  cross-build-quality-interpreter:
    name: Early old/new high-DPI quality (Interpreter)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
          submodules: recursive
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.baseline_ref }}
          submodules: recursive
          path: baseline
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Pin both correctness builds to the same toolchain
        run: |
          python harness/tests/UnoDraw.BrowserPerformance/toolchain.py --source source --pin
          python harness/tests/UnoDraw.BrowserPerformance/toolchain.py --source baseline --pin
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json
      - name: Install and verify the pinned WebAssembly tools
        working-directory: source
        run: |
          dotnet workload install wasm-tools
          python ../harness/tests/UnoDraw.BrowserPerformance/toolchain.py --source .
          python ../harness/tests/UnoDraw.BrowserPerformance/toolchain.py --source ../baseline
      - name: Publish candidate interpreter package for correctness only
        working-directory: source
        env:
          BINARYEN_CORES: '1'
        run: >-
          dotnet publish samples/UnoDraw/UnoDraw.csproj
          -f net10.0-browserwasm -p:UnoDrawTargetFrameworks=net10.0-browserwasm
          -c Release -p:WasmShellMonoRuntimeExecutionMode=Interpreter
          -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          -o ../artifacts/early-quality-packages/candidate
      - name: Publish matching baseline interpreter package
        working-directory: baseline
        env:
          BINARYEN_CORES: '1'
        run: >-
          dotnet publish samples/UnoDraw/UnoDraw.csproj
          -f net10.0-browserwasm -p:UnoDrawTargetFrameworks=net10.0-browserwasm
          -c Release -p:WasmShellMonoRuntimeExecutionMode=Interpreter
          -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          -o ../artifacts/early-quality-packages/baseline
      - name: Record both actual interpreter execution modes
        run: |
          python harness/tests/UnoDraw.BrowserPerformance/package_manifest.py --source source --package artifacts/early-quality-packages/candidate --role candidate --execution-mode Interpreter
          python harness/tests/UnoDraw.BrowserPerformance/package_manifest.py --source baseline --package artifacts/early-quality-packages/baseline --role baseline --execution-mode Interpreter
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the same pinned native-pixel browser
        run: |
          python -m pip install -r harness/tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s harness/tests/UnoDraw.BrowserPerformance -p 'test_*.py'
          python -m unittest discover -s harness/tests/UnoDraw.BrowserRenderQuality -p 'test_*.py'
      - name: Compare unchanged native pixels on matched interpreter packages
        run: >-
          python harness/tests/UnoDraw.BrowserRenderQuality/render_quality.py
          --packages artifacts/early-quality-packages
          --output artifacts/unodraw-cross-interpreter-quality --execution-mode Interpreter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-cross-build-interpreter-quality
          path: artifacts/unodraw-cross-interpreter-quality
          if-no-files-found: warn
          retention-days: 14

  cross-build-quality:
    name: Old/new AOT native-pixel quality (DPR 1.25, 2)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-candidate
          path: artifacts/cross-build/candidate
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-baseline
          path: artifacts/cross-build/baseline
      - name: Verify the current AOT application source
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/verify_source.py
          --package artifacts/cross-build/candidate --output artifacts/unodraw-cross-build-quality
          --package-run-id "$GITHUB_RUN_ID"
      - name: Install the pinned browser and verify quality contracts
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests/UnoDraw.BrowserRenderQuality -p 'test_*.py'
      - name: Compare current and candidate pixels at native high DPI
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/render_quality.py
          --packages artifacts/cross-build --output artifacts/unodraw-cross-build-quality
      - name: Publish the available comparison summary
        if: always()
        run: |
          if test -f artifacts/unodraw-cross-build-quality/summary.md; then
            cat artifacts/unodraw-cross-build-quality/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-cross-build-native-quality
          path: artifacts/unodraw-cross-build-quality
          if-no-files-found: warn
          retention-days: 14

  direct-legacy-baseline-comparison:
    name: Direct baseline versus opt-in legacy composition
    needs: [plan, publish]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/unodraw-legacy-baseline-comparison.yml
    with:
      package_run_id: ${{ format('{0}', github.run_id) }}
      harness_sha: ${{ github.event.pull_request.head.sha || github.sha }}
