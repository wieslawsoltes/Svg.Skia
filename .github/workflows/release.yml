name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate release tag
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Run this workflow from a v* release tag."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tags must point to a commit on $DEFAULT_BRANCH."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          package_version="$(dotnet msbuild src/Svg.Skia/Svg.Skia.csproj -nologo -p:Configuration=Release -getProperty:PackageVersion)"
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Release tag must be v$package_version to match the Svg.Skia package version."
            exit 1
          fi

          prerelease=false
          if [[ "${version%%+*}" == *-* ]]; then
            prerelease=true
          fi

          printf 'version=%s\nis-prerelease=%s\n' "$version" "$prerelease" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Svg.Skia.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build Svg.Skia.slnx -c Release --no-restore

  test:
    name: Test Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Svg.Skia.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build Svg.Skia.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Svg.Skia.slnx -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Release Test Results
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  pack:
    name: Pack Release
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Svg.Skia.slnx -p:Configuration=Release

      - name: Pack
        run: dotnet pack Svg.Skia.slnx -c Release --no-restore -o artifacts/packages

      - name: Verify Linux package dependencies
        run: bash scripts/verify_linux_package_dependencies.sh artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  pack-maui:
    name: Pack MAUI Release
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        working-directory: src/SvgML.Maui
        run: dotnet workload install maui --ignore-failed-sources --skip-manifest-update

      - name: Restore libraries
        working-directory: src/SvgML.Maui
        run: |
          dotnet restore SvgML.Maui.csproj
          dotnet restore ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj

      - name: Build libraries
        working-directory: src/SvgML.Maui
        run: |
          dotnet build SvgML.Maui.csproj -c Release --no-restore
          dotnet build ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj -c Release --no-restore

      - name: Pack
        working-directory: src/SvgML.Maui
        run: |
          dotnet pack SvgML.Maui.csproj -c Release --no-restore -o ../../artifacts/maui-packages
          dotnet pack ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj -c Release --no-restore -o ../../artifacts/maui-packages

      - name: Build sample
        working-directory: src/SvgML.Maui
        run: dotnet build ../../samples/SvgML.Maui.Demo/SvgML.Maui.Demo.csproj -f net10.0-android -c Release -p:RuntimeIdentifier=android-arm64

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: release-maui-nuget-packages
          path: |
            artifacts/maui-packages/*.nupkg
            artifacts/maui-packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build, pack, pack-maui]
    environment: nuget
    permissions:
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-nuget-packages
          path: packages

      - name: Download MAUI NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-maui-nuget-packages
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Sign in to NuGet with OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          push_args=(--source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate)
          dotnet nuget push 'packages/*.nupkg' "${push_args[@]}" --no-symbols

          # Push symbols separately so a retry can finish after a package was already published.
          if compgen -G 'packages/*.snupkg' > /dev/null; then
            dotnet nuget push 'packages/*.snupkg' "${push_args[@]}"
          fi

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, pack, pack-maui, publish-nuget]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-packages
          path: packages

      - name: Download MAUI NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: release-maui-nuget-packages
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Svg.Skia v${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.build.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          files: |
            packages/*.nupkg
            packages/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
