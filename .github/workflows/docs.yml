name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build docs
        run: |
          chmod +x build-docs.sh
          ./build-docs.sh

      - name: Upload docs artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./site/.lunet/build/www
          include-hidden-files: true
          if-no-files-found: error

  browser:
    name: WebAssembly package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish browser application
        env:
          # Bound optimizer memory use for the preserved SVG/Uno assembly graph.
          # This keeps the existing AOT and optimization settings.
          BINARYEN_CORES: '1'
        run: |
          (
            while true; do
              date -u '+Optimizer resource sample: %Y-%m-%dT%H:%M:%SZ'
              free -m
              ps -C wasm-opt -o pid,rss,vsz,etime,nlwp || true
              sleep 30
            done
          ) &
          unodraw_resource_monitor_pid=$!
          trap 'kill "$unodraw_resource_monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time --verbose dotnet publish samples/UnoDraw/UnoDraw.csproj -f net10.0-browserwasm -p:UnoDrawTargetFrameworks=net10.0-browserwasm -c Release -p:WasmShellMonoRuntimeExecutionMode=InterpreterAndAOT -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false -o artifacts/unodraw-browser
      - uses: actions/upload-artifact@v4
        with:
          name: unodraw-browser
          path: artifacts/unodraw-browser
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    name: Published WebAssembly runtime smoke
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download the exact published package
        uses: actions/download-artifact@v4
        with:
          name: unodraw-browser
          path: artifacts/unodraw-browser
      - name: Install pinned browser-test dependencies
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m py_compile tests/UnoDraw.BrowserSmoke/smoke.py
          python -m playwright install --with-deps chromium
      - name: Stage the GitHub Pages project and application subfolders
        run: |
          mkdir -p artifacts/pages/Svg.Skia/unodraw
          cp -a artifacts/unodraw-browser/wwwroot/. artifacts/pages/Svg.Skia/unodraw/
      - name: Check runtime startup, command search, compact layout and reload
        run: python tests/UnoDraw.BrowserSmoke/smoke.py --site artifacts/pages --base-path /Svg.Skia/unodraw/ --output artifacts/unodraw-browser-smoke
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unodraw-browser-smoke
          path: artifacts/unodraw-browser-smoke
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: [build, browser-smoke]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ./site/.lunet/build/www

      - name: Download the tested UnoDraw package
        uses: actions/download-artifact@v4
        with:
          name: unodraw-browser
          path: artifacts/unodraw-browser

      - name: Add UnoDraw alongside the docs
        run: |
          test -f artifacts/unodraw-browser/wwwroot/index.html
          test -f site/.lunet/build/www/index.html
          mkdir -p site/.lunet/build/www/unodraw
          cp -a artifacts/unodraw-browser/wwwroot/. site/.lunet/build/www/unodraw/
          touch site/.lunet/build/www/.nojekyll

      # AOT WebAssembly binaries can exceed Git's per-file size limit. Publish
      # the combined static site as a Pages artifact instead of committing it.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the combined Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/.lunet/build/www

      - name: Deploy docs and UnoDraw to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
