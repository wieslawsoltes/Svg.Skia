name: UnoDraw Studio UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/unodraw-studio.yml'
      - 'src/Svg.Editor.Skia.Uno/**'
      - 'src/Svg.Editor.Skia/**'
      - 'samples/UnoDraw/**'
      - 'tests/UnoDraw.StudioSmoke/**'
      - 'tests/Svg.Editor.Skia.UnitTests/**'

permissions:
  contents: read

concurrency:
  group: unodraw-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-studio:
    name: Native studio interaction and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate smoke harness and shared theme contracts
        run: |
          bash -n tests/UnoDraw.StudioSmoke/smoke.sh
          bash -n tests/UnoDraw.StudioSmoke/advanced.sh
          bash -n tests/UnoDraw.StudioSmoke/themes.sh
          bash -n tests/UnoDraw.StudioSmoke/controls.sh
          bash -n tests/UnoDraw.StudioSmoke/command-center.sh
          python3 -m unittest discover -s tests/UnoDraw.StudioSmoke -p 'test_*.py' -v
      - name: Install native inspection tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick dbus-x11 x11-utils
      - name: Build the actual desktop application
        run: dotnet build samples/UnoDraw/UnoDraw.csproj -f net10.0-desktop -c Release
      - name: Test workspace, command search, responsive forms, gradients, arrangement and save invariants
        run: dotnet test tests/Svg.Editor.Skia.UnitTests/Svg.Editor.Skia.UnitTests.csproj -c Release --filter "FullyQualifiedName~SvgWorkspaceLayoutTests|FullyQualifiedName~SvgStudioGridMetricsTests|FullyQualifiedName~SvgGradientRampTests|FullyQualifiedName~SvgGradientEditingTests|FullyQualifiedName~SvgArrangementTests|FullyQualifiedName~SvgEditorSaveContinuityTests|FullyQualifiedName~SvgCommandSearchIndexTests" --logger 'trx;LogFileName=studio-layout.trx' --results-directory artifacts/unodraw-studio
      - name: Exercise editing, shared controls, command search and every panel in both themes
        timeout-minutes: 10
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1100x24 -nolisten tcp' \
            dbus-run-session -- bash tests/UnoDraw.StudioSmoke/command-center.sh \
            samples/UnoDraw/bin/Release/net10.0-desktop/UnoDraw.dll artifacts/unodraw-studio
      - name: Upload screenshots and validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unodraw-studio-native
          path: artifacts/unodraw-studio
          if-no-files-found: warn
          retention-days: 14
