name: UnoDraw pinned runtime diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/unodraw-runtime-diagnostics.yml'
      - 'tests/UnoDraw.BrowserPerformance/pinned_package.py'
      - 'tests/UnoDraw.BrowserPerformance/test_pinned_package.py'
      - 'tests/UnoDraw.BrowserPerformance/runtime_diagnostic_contracts.py'
      - 'tests/UnoDraw.BrowserPerformance/runtime_diagnostics.py'
      - 'tests/UnoDraw.BrowserPerformance/test_runtime_diagnostics.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: unodraw-pinned-runtime-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Compare pinned runtime command evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check diagnostic identity and configuration boundaries
        run: |
          python -m unittest discover -s tests/UnoDraw.BrowserPerformance -p 'test_pinned_package.py'
          python -m unittest discover -s tests/UnoDraw.BrowserPerformance -p 'test_runtime_diagnostics.py'
      - name: Download immutable source snapshots and verify their archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tests/UnoDraw.BrowserPerformance/pinned_package.py --role baseline --output artifacts/runtime-packages/baseline
          python tests/UnoDraw.BrowserPerformance/pinned_package.py --role candidate --output artifacts/runtime-packages/candidate
      - name: Install pinned browser dependencies
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect separately configured runtime diagnostics
        run: >-
          python tests/UnoDraw.BrowserPerformance/runtime_diagnostics.py
          --packages artifacts/runtime-packages
          --output artifacts/unodraw-runtime-diagnostics
          --harness-sha "$(git rev-parse HEAD)"
      - name: Publish diagnostic summary
        if: always()
        run: |
          if test -f artifacts/unodraw-runtime-diagnostics/summary.md; then
            cat artifacts/unodraw-runtime-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-pinned-runtime-diagnostics
          path: artifacts/unodraw-runtime-diagnostics
          if-no-files-found: warn
          retention-days: 14
