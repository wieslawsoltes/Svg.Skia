name: UnoDraw complete SVG quality by device scale

on:
  workflow_call:
    inputs:
      package_run_id:
        type: string
        required: true
      harness_sha:
        type: string
        required: true
      candidate_bridge:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Existing performance run containing the candidate AOT package
        type: string
        required: true
      harness_sha:
        description: Exact harness commit with equivalent production source
        type: string
        required: true
      candidate_bridge:
        description: Explicit document renderer compared with its original control
        type: choice
        options: [legacy-composite, composite, single-canvas]
        default: legacy-composite

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: All eight SVG scenes at DPR ${{ matrix.dpr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dpr: ['1', '1.25', '2']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.harness_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the immutable AOT archive and retain its full asset receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: >-
          python tests/UnoDraw.BrowserPerformance/candidate_package.py
          --run-id "$PACKAGE_RUN_ID" --output artifacts/package
          --receipt artifacts/svg-quality/package-artifact.json
      - name: Reject stale production source before native comparisons
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/verify_source.py
          --package artifacts/package --output artifacts/svg-quality
          --package-run-id "$PACKAGE_RUN_ID"
      - name: Install the pinned browser and verify the original and sharded contracts
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests/UnoDraw.BrowserRenderQuality -p 'test_*.py'
      - name: Compare both modes and all source transitions at one device scale
        env:
          CANDIDATE_BRIDGE: ${{ inputs.candidate_bridge }}
          DEVICE_SCALE: ${{ matrix.dpr }}
        run: |
          python tests/UnoDraw.BrowserRenderQuality/svg_bridge_quality.py \
            --package artifacts/package --output artifacts/svg-quality \
            --candidate-bridge "$CANDIDATE_BRIDGE" --dpr "$DEVICE_SCALE"
      - name: Publish this explicitly incomplete matrix portion
        if: always()
        run: |
          if test -f artifacts/svg-quality/summary.md; then
            cat artifacts/svg-quality/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-svg-quality-${{ inputs.candidate_bridge }}-dpr-${{ matrix.dpr }}
          path: artifacts/svg-quality
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Verify every SVG scene, scale and native pixel comparison
    needs: compare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.harness_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native-image validation dependencies
        run: python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: unodraw-svg-quality-${{ inputs.candidate_bridge }}-dpr-*
          path: artifacts/svg-shards
      - name: Recompute native images and require the complete 48-case, 72-pair matrix
        env:
          SHARD_JOBS_RESULT: ${{ needs.compare.result }}
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/merge_svg_shards.py
          --shards artifacts/svg-shards --output artifacts/svg-aggregate
          --shard-jobs-result "$SHARD_JOBS_RESULT"
      - name: Publish the complete qualification decision
        if: always()
        run: |
          if test -f artifacts/svg-aggregate/summary.md; then
            cat artifacts/svg-aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-svg-quality-${{ inputs.candidate_bridge }}-aggregate
          path: artifacts/svg-aggregate
          if-no-files-found: warn
          retention-days: 14
