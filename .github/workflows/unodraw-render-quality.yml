name: UnoDraw rendering verification

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Performance run containing matching baseline, candidate and reference AOT packages
        required: true
        default: '43223723275'
  pull_request:
    paths:
      - '.github/workflows/unodraw-render-quality.yml'
      - 'tests/UnoDraw.BrowserRenderQuality/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: unodraw-native-quality-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: Qualify cached AOT artifacts for this source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source eligibility contracts
        run: python -m unittest discover -s tests/UnoDraw.BrowserRenderQuality -p 'test_source_equivalence.py'
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-candidate
          path: artifacts/packages/candidate
          run-id: ${{ inputs.package_run_id || '43223723275' }}
          github-token: ${{ github.token }}
      - name: Identify stale artifacts before scheduling cached verification
        id: source
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || '43223723275' }}
        run: |
          options=()
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            options+=(--report-only)
          fi
          python tests/UnoDraw.BrowserRenderQuality/verify_source.py \
            --package artifacts/packages/candidate --output artifacts/unodraw-artifact-eligibility \
            --package-run-id "$PACKAGE_RUN_ID" --github-output "$GITHUB_OUTPUT" "${options[@]}"
      - name: Publish the source eligibility decision
        if: always()
        run: |
          if test -f artifacts/unodraw-artifact-eligibility/summary.md; then
            cat artifacts/unodraw-artifact-eligibility/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-cached-artifact-eligibility
          path: artifacts/unodraw-artifact-eligibility
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Existing AOT native pixels (${{ matrix.suite }})
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [bridge, cross-build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-candidate
          path: artifacts/packages/candidate
          run-id: ${{ inputs.package_run_id || '43223723275' }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-baseline
          path: artifacts/packages/baseline
          run-id: ${{ inputs.package_run_id || '43223723275' }}
          github-token: ${{ github.token }}
      - name: Reject stale binaries after any production-source change
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || '43223723275' }}
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/verify_source.py
          --package artifacts/packages/candidate --output artifacts/unodraw-render-quality/${{ matrix.suite }}
          --package-run-id "$PACKAGE_RUN_ID"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned correctness-test browser and check harness contracts
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests/UnoDraw.BrowserPerformance -p 'test_*.py'
          python -m unittest discover -s tests/UnoDraw.BrowserRenderQuality -p 'test_*.py'
          node --test tests/UnoDraw.BrowserPerformance/test_instrumentation.mjs
      - name: Verify persistent and legacy bridges on the existing candidate AOT binary
        if: matrix.suite == 'bridge'
        run: >-
          python tests/UnoDraw.BrowserPerformance/bridge_quality.py
          --package artifacts/packages/candidate --output artifacts/unodraw-render-quality/${{ matrix.suite }}
      - name: Compare baseline and candidate at native high-DPI resolution
        if: matrix.suite == 'cross-build'
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/render_quality.py
          --packages artifacts/packages --output artifacts/unodraw-render-quality/${{ matrix.suite }}
      - name: Publish the available summary
        if: always()
        run: |
          if test -f "artifacts/unodraw-render-quality/${{ matrix.suite }}/summary.md"; then
            cat "artifacts/unodraw-render-quality/${{ matrix.suite }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-render-quality-${{ matrix.suite }}
          path: artifacts/unodraw-render-quality/${{ matrix.suite }}
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Matched AOT ${{ matrix.backend }} ${{ matrix.workload }}
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, skia-preferred]
        workload: [idle, brush-hover, pan, zoom, selection, edit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-candidate
          path: artifacts/packages/candidate
          run-id: ${{ inputs.package_run_id || '43223723275' }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-baseline
          path: artifacts/packages/baseline
          run-id: ${{ inputs.package_run_id || '43223723275' }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-reference
          path: artifacts/packages/reference
          run-id: ${{ inputs.package_run_id || '43223723275' }}
          github-token: ${{ github.token }}
      - name: Reject stale binaries after any production-source change
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || '43223723275' }}
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/verify_source.py
          --package artifacts/packages/candidate --output artifacts/unodraw-render-quality/performance-${{ matrix.backend }}-${{ matrix.workload }}
          --package-run-id "$PACKAGE_RUN_ID"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned correctness-test browser and check harness contracts
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests/UnoDraw.BrowserPerformance -p 'test_*.py'
          python -m unittest discover -s tests/UnoDraw.BrowserRenderQuality -p 'test_*.py'
          node --test tests/UnoDraw.BrowserPerformance/test_instrumentation.mjs
      - name: Compare all matching revisions and repeats on this runner
        run: >-
          python tests/UnoDraw.BrowserPerformance/performance.py
          --packages artifacts/packages --output artifacts/unodraw-render-quality/performance-${{ matrix.backend }}-${{ matrix.workload }}
          --repeats 3 --steps 120 --graphics swiftshader --diagnostics
          --backend ${{ matrix.backend }} --workload ${{ matrix.workload }}
      - name: Publish the available summary
        if: always()
        run: |
          if test -f "artifacts/unodraw-render-quality/performance-${{ matrix.backend }}-${{ matrix.workload }}/summary.md"; then
            cat "artifacts/unodraw-render-quality/performance-${{ matrix.backend }}-${{ matrix.workload }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-performance-shard-${{ matrix.backend }}-${{ matrix.workload }}
          path: artifacts/unodraw-render-quality/performance-${{ matrix.backend }}-${{ matrix.workload }}
          if-no-files-found: warn
          retention-days: 14

  diagnostics:
    name: Candidate pan phases (${{ matrix.backend }})
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, skia-preferred]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-candidate
          path: artifacts/packages/candidate
          run-id: ${{ inputs.package_run_id || '43223723275' }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: unodraw-performance-package-baseline
          path: artifacts/packages/baseline
          run-id: ${{ inputs.package_run_id || '43223723275' }}
          github-token: ${{ github.token }}
      - name: Reject stale binaries after any production-source change
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || '43223723275' }}
        run: >-
          python tests/UnoDraw.BrowserRenderQuality/verify_source.py
          --package artifacts/packages/candidate --output artifacts/unodraw-render-quality/diagnostic-${{ matrix.backend }}-pan
          --package-run-id "$PACKAGE_RUN_ID"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned correctness-test browser and check harness contracts
        run: |
          python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests/UnoDraw.BrowserPerformance -p 'test_*.py'
          python -m unittest discover -s tests/UnoDraw.BrowserRenderQuality -p 'test_*.py'
          node --test tests/UnoDraw.BrowserPerformance/test_instrumentation.mjs
      - name: Collect candidate paint phases without a speedup claim
        run: >-
          python tests/UnoDraw.BrowserPerformance/diagnose.py
          --packages artifacts/packages --output artifacts/unodraw-render-quality/diagnostic-${{ matrix.backend }}-pan
          --backend ${{ matrix.backend }} --workload pan
      - name: Publish the available summary
        if: always()
        run: |
          if test -f "artifacts/unodraw-render-quality/diagnostic-${{ matrix.backend }}-pan/summary.md"; then
            cat "artifacts/unodraw-render-quality/diagnostic-${{ matrix.backend }}-pan/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-candidate-diagnostic-${{ matrix.backend }}-pan
          path: artifacts/unodraw-render-quality/diagnostic-${{ matrix.backend }}-pan
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Verify all twelve performance comparisons
    needs: [eligibility, performance]
    if: always() && needs.eligibility.result == 'success' && needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install report-validation dependencies
        run: python -m pip install -r tests/UnoDraw.BrowserSmoke/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: unodraw-performance-shard-*
          path: artifacts/performance-shards
      - name: Require all ninety primary and twelve diagnostic trials
        run: >-
          python tests/UnoDraw.BrowserPerformance/merge_shards.py
          --shards artifacts/performance-shards --output artifacts/unodraw-performance
          --require-reference --repeats 3
      - name: Publish the available summary
        if: always()
        run: |
          if test -f "artifacts/unodraw-performance/summary.md"; then
            cat "artifacts/unodraw-performance/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unodraw-performance-results
          path: artifacts/unodraw-performance
          if-no-files-found: warn
          retention-days: 14
